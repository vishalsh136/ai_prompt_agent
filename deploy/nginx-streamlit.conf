# Optional: put Streamlit behind Nginx with HTTP Basic Auth.
# Recommended because the app can place real trades — do not expose 8501 raw.
#
# Setup:
#   sudo apt-get install -y nginx apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd youruser        # sets a password
#   sudo cp deploy/nginx-streamlit.conf /etc/nginx/sites-available/streamlit
#   sudo ln -s /etc/nginx/sites-available/streamlit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then in Lightsail firewall: open 80 (and 443 if you add HTTPS), and you can
# CLOSE 8501 to the public since Nginx proxies to it locally.
# For HTTPS use certbot: sudo apt-get install -y certbot python3-certbot-nginx
#                        sudo certbot --nginx -d your.domain

server {
    listen 80;
    server_name _;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Streamlit requires this)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
