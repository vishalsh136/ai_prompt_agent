name: Auto Algo Trader Loop

on:
  schedule:
    - cron: '*/15 9-15 * * 1-5'  # Every 15 min, 9:30 AM - 3:30 PM IST (Mon-Fri)
  workflow_dispatch:

jobs:
  run-algo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.algo_auto_trader --loop --max-cycles=1